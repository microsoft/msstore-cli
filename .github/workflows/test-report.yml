name: 'Test Report'
on:
  workflow_run:
    workflows: ['CI']                     # runs after CI workflow
    types:
      - completed
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  # Fork PRs cannot write check runs, so this privileged follow-up job reports their test results.
  # It only parses the .trx artifact and attaches the check to workflow_run.head_sha; it must never
  # check out or execute code from the triggering run.
  report:
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Display test results
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        artifact: test-results-${{ matrix.os }}
        name: Test - Results - ${{ matrix.os }}
        path: '*.trx'
        reporter: dotnet-trx